name: Terbitkan ke GitHub Pages

# Jalur penerbitan cadangan, sengaja hanya manual.
#
# Portal utama disajikan Worker `aksara` di https://penama.online/info/ dengan
# cara mem-proxy repositori ini, sehingga tidak butuh Pages maupun data DNS.
# Alur ini disimpan agar portal tetap bisa dipindah ke GitHub Pages kapan pun:
# aktifkan Pages di Settings, jalankan alur ini, lalu arahkan variabel
# PENAMA_PORTAL_URL di AKSARA ke alamat Pages tersebut.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  terbit:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Periksa berkas data sebelum terbit
        run: node scripts/validate-data.mjs
      # enablement: true menyalakan GitHub Pages lewat API bila belum aktif,
      # sehingga penerbitan pertama tidak perlu diklik manual di Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
